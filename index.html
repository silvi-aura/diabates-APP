  <details open><summary>👨 Próstata: qué es y qué problemas puede dar</summary>
  <p>La próstata es una glándula que forma parte del aparato reproductor masculino y está debajo de la vejiga, rodeando parte de la uretra. Con la edad puede aumentar de tamaño. Tener síntomas no significa automáticamente tener cáncer.</p>
  <h3>Agrandamiento benigno (HBP)</h3><p>Es un crecimiento no canceroso, frecuente con la edad. Puede causar chorro débil o entrecortado, dificultad para empezar, goteo al terminar, sensación de no vaciar la vejiga, necesidad urgente o frecuente de orinar y levantarse varias veces por la noche.</p>
  <h3>Prostatitis</h3><p>Es una inflamación de la próstata; algunas formas se relacionan con infección. Puede provocar dolor en la pelvis, periné o zona baja de la espalda, molestias al orinar o eyacular, urgencia urinaria y, si hay infección aguda, fiebre y escalofríos. Fiebre con síntomas urinarios requiere atención rápida.</p>
  <h3>Cáncer de próstata</h3><p>En etapas iniciales puede no dar síntomas. Los problemas para orinar también pueden deberse a causas benignas, por eso no se puede distinguir por síntomas solamente. La edad, antecedentes familiares y otros factores modifican el riesgo. Consultá con un profesional si corresponde conversar sobre el análisis de PSA y sus beneficios, limitaciones y posibles consecuencias; no es una prueba que deba indicarse igual a todas las personas.</p>
  </details>
  <details><summary>❓ Dudas frecuentes sobre la próstata</summary>
  <p><b>¿Orinar de noche significa cáncer?</b> No. Puede relacionarse con HBP, diabetes, medicamentos, problemas de sueño u otras causas. Si es nuevo, persistente o molesto, consultá.</p>
  <p><b>¿La HBP se convierte en cáncer?</b> No: son condiciones distintas. Pueden coexistir y los síntomas no permiten diferenciarlas sin evaluación.</p>
  <p><b>¿Puedo prevenir por completo los problemas de próstata?</b> No hay una estrategia garantizada. Mantener actividad física, cuidar la salud metabólica y consultar ante síntomas ayuda a cuidar la salud general, pero no elimina el riesgo.</p>
  <p><b>¿Debo dejar de tomar agua?</b> No te deshidrates. Si te levantás mucho de noche, consultá si conviene ajustar el horario de líquidos y revisá con tu médico los medicamentos; no los suspendas por tu cuenta.</p>
  <p><b>¿Qué estudio necesito?</b> Depende de los síntomas, edad, antecedentes y evaluación clínica. El profesional puede indicar examen físico, análisis de orina, PSA u otros estudios según el caso. El PSA no confirma por sí solo un cáncer: también puede subir por una próstata agrandada o inflamada, y conviene conversar sus ventajas y limitaciones.</p>
  <h3>¿Hay tratamiento?</h3><p>Sí, según la causa. Para el agrandamiento benigno pueden recomendar seguimiento, medicamentos o procedimientos si los síntomas lo justifican. La prostatitis se trata según su tipo; los antibióticos se usan cuando el profesional sospecha o confirma una infección bacteriana. Si se detecta cáncer, el equipo especializado explica las opciones según el tipo, la extensión, el estado general y las preferencias de la persona. No empieces ni suspendas tratamientos por tu cuenta.</p>
  </details>
  <details open><summary>🩸 Diabetes y próstata: cómo se relacionan</summary>
  <p>La diabetes no significa que vayas a tener un problema de próstata, pero la diabetes tipo 2 se asocia con mayor probabilidad de agrandamiento benigno en algunos grupos. Además, la glucosa elevada y el daño de los nervios pueden afectar la vejiga: causar más ganas de orinar, urgencia, pérdidas o dificultad para vaciarla. Estos síntomas se pueden parecer a los de la próstata y pueden coexistir; no conviene asumir la causa.</p>
  <p>La diabetes también puede afectar la circulación y los nervios implicados en la erección, el deseo y la eyaculación. En algunas personas, una glucemia elevada favorece infecciones genitales (por ejemplo, inflamación o irritación del glande). Algunos cambios sexuales pueden ser una señal para revisar el control de la diabetes, la presión, el colesterol, los medicamentos y otros factores tratables.</p>
  <h3>Qué podés hacer</h3><ul>
  <li>Seguí tu plan de glucemia y tomá la medicación tal como fue indicada; no cambies dosis sin consultar.</li>
  <li>Realizá los controles de diabetes, presión, colesterol y riñón que te indiquen.</li>
  <li>Hidratate, movete según tus posibilidades y evitá fumar.</li>
  <li>Anotá cuándo aparecen los síntomas, cuántas veces orinás de día/noche, si hay dolor, pérdidas o cambios sexuales y qué medicamentos tomás.</li>
  <li>Comentá estos cambios con tu médico clínico, diabetólogo o urólogo. Hay opciones de evaluación y tratamiento.</li></ul>
  </details>
  <div id="mujeres" style="scroll-margin-top:5rem">
  <h3>👩 Salud femenina: vejiga, salud sexual y suelo pélvico</h3>
  <p>Esta parte también es para vos si sos mujer o querés acompañar a alguien de tu familia. La próstata no se aplica a las mujeres, pero la diabetes puede afectar a personas de cualquier género. Puede aumentar el riesgo de infecciones urinarias y, cuando la glucosa está elevada, de infecciones por hongos. También puede afectar los nervios y la circulación, y contribuir a urgencia urinaria, pérdidas, dificultad para vaciar la vejiga, sequedad vaginal, molestias durante las relaciones o cambios en el deseo y la respuesta sexual.</p>
  <p>En la menopausia, los cambios hormonales pueden influir en el control de la glucosa en algunas personas y cambiar la lubricación y la salud vaginal/urinaria. No tenés que resignarte ni sentir vergüenza: consultá con medicina clínica, ginecología o el equipo de diabetes. El tratamiento depende de la causa y puede mejorar los síntomas.</p>
  <p><b>Consultá pronto</b> si tenés ardor al orinar, urgencia o frecuencia nueva, dolor bajo vientre, pérdidas persistentes, picazón o flujo inusual. Fiebre, escalofríos, dolor en la espalda/costado, vómitos o sangre en la orina requieren atención urgente.</p>

  <h3>🧘 Suelo pélvico: qué es y para qué sirve</h3>
  <p>El suelo pélvico (también llamado piso pélvico) es un conjunto de músculos y tejidos que forman una base de sostén dentro de la pelvis. Ayuda a sostener la vejiga, el útero y el intestino/recto; participa en el control de la orina, los gases y las heces, y en la función sexual. Para trabajar bien, estos músculos necesitan tanto fuerza como capacidad de relajarse y coordinarse.</p>
  <p><b>No es solo un tema de después del parto ni de la vejez.</b> Puede haber síntomas en distintas etapas de la vida, y son frecuentes. Tener pérdidas, pesadez o dolor no es culpa tuya y no tenés que resignarte: hay evaluación y tratamientos.</p>
  <div class="card"><h3>¿Qué señales conviene reconocer?</h3><p>Prestá atención a pérdidas al toser, reír o hacer ejercicio; necesidad urgente o frecuente de orinar; presión o sensación de bulto vaginal; dolor pélvico o durante las relaciones; estreñimiento o dificultad para controlar gases o heces. No todas estas señales tienen la misma causa, pero si aparecen de forma repetida merecen consulta.</p><p><b>Importante:</b> no toda molestia se soluciona haciendo Kegel. Algunas personas necesitan aprender a relajar y coordinar estos músculos, especialmente si hay dolor o tensión.</p></div>

  <details><summary>🔎 Señales de que el suelo pélvico puede necesitar atención</summary>
  <ul>
  <li><b>Pérdidas con esfuerzo:</b> se escapa orina al toser, estornudar, reír, saltar, levantar peso o hacer ejercicio.</li>
  <li><b>Urgencia:</b> aparece una necesidad repentina y difícil de aguantar, a veces con escapes o necesidad de ir muchas veces al baño.</li>
  <li><b>Sensación de peso o bulto:</b> pesadez, presión vaginal o sensación de que algo desciende, que puede empeorar al estar mucho tiempo de pie.</li>
  <li><b>Dificultad para vaciar:</b> cuesta empezar a orinar, queda sensación de vejiga llena o hay infecciones urinarias repetidas.</li>
  <li><b>Intestino:</b> escapes de gases o heces, dificultad para llegar al baño, estreñimiento o necesidad de hacer mucha fuerza.</li>
  <li><b>Dolor o tensión:</b> dolor pélvico, molestias con la penetración, durante o después de las relaciones, o dificultad para relajar la zona.</li>
  </ul>
  <p>Estos síntomas pueden tener distintas causas y no confirman por sí solos un trastorno del suelo pélvico. Si son nuevos, frecuentes, empeoran o afectan tu vida cotidiana, pedí una consulta.</p>
  </details>

  <details><summary>🌷 Embarazo, parto, menopausia y otros factores</summary>
  <p>El embarazo y el parto vaginal pueden estirar o debilitar los tejidos; también puede haber síntomas después de una cesárea. La edad, los cambios hormonales de la menopausia, el estreñimiento crónico, la tos persistente, el exceso de peso, levantar cargas repetidamente y algunas cirugías pueden influir. Los factores varían de una persona a otra, y tener uno no significa que necesariamente vayas a desarrollar un problema.</p>
  <p>Un posible <b>prolapso de órganos pélvicos</b> ocurre cuando los tejidos que sostienen la vejiga, el útero o el recto pierden parte de su soporte. Puede provocar presión, pesadez o un bulto en la vagina, cambios al orinar o problemas intestinales. No siempre requiere cirugía: el tratamiento depende de los síntomas y puede incluir fisioterapia especializada, cambios para reducir el esfuerzo, un pesario u otras opciones indicadas por el equipo de salud.</p>
  <p>Después del parto, consultá si tenés pérdidas, dolor, sensación de peso, dificultad para vaciar la vejiga o problemas para controlar gases o heces. No necesitás esperar a que los síntomas sean intensos.</p>
  </details>

  <details><summary>🌼 SOP (síndrome de ovario poliquístico) y diabetes</summary>
  <p>El SOP es una condición hormonal y metabólica que puede presentarse durante la etapa reproductiva. No significa que una persona tenga necesariamente quistes ni diabetes. Entre las señales posibles están menstruaciones irregulares o ausentes, acné persistente, aumento de vello facial o corporal y dificultades para ovular; algunas personas no presentan todos estos síntomas.</p>
  <p>En muchas personas con SOP hay resistencia a la insulina, lo que se relaciona con un mayor riesgo de prediabetes y diabetes tipo 2. Eso no quiere decir que sea inevitable: la evaluación y el seguimiento médico ayudan a conocer el riesgo individual y elegir controles y tratamientos adecuados.</p>
  <p>Consultá con ginecología o medicina clínica si tus ciclos son muy irregulares, pasan meses sin menstruación, aparecen cambios hormonales importantes o te preocupa la fertilidad. El diagnóstico no se confirma por un solo síntoma ni únicamente por una ecografía; el profesional considera la historia clínica y los estudios necesarios.</p>
  <p><a href="https://medlineplus.gov/spanish/polycysticovarysyndrome.html" target="_blank" rel="noopener">MedlinePlus: síndrome de ovario poliquístico</a></p>
  </details>

  <details><summary>🩸 Diabetes y suelo pélvico: qué relación tienen</summary>
  <p>La diabetes no significa automáticamente que tengas debilidad del suelo pélvico. Sin embargo, la glucosa elevada durante mucho tiempo puede dañar nervios y vasos sanguíneos y afectar la vejiga. Algunas personas notan más frecuencia o urgencia para orinar, escapes o dificultad para sentir si la vejiga está llena y vaciarla por completo. La diabetes también aumenta el riesgo de infecciones urinarias; si se repiten, conviene consultar para investigar la causa.</p>
  <p>Los síntomas de vejiga pueden coexistir con debilidad del suelo pélvico, prolapso, cambios de la menopausia u otros problemas. No asumas que todo se debe a la diabetes ni empieces un tratamiento sin conocer la causa. Llevar un registro de horarios, escapes, líquidos, síntomas y glucemias puede ayudar a la consulta.</p>
  <p>Seguir el plan de diabetes, mantener los controles indicados y consultar ante cambios urinarios ayuda a cuidar la salud general, pero no sustituye la evaluación ni garantiza que no aparezcan problemas.</p>
  </details>

  <details><summary>💪 Ejercicios de Kegel: cómo empezar con cuidado</summary>
  <p>Los ejercicios de Kegel entrenan la contracción de los músculos del suelo pélvico y pueden ayudar en algunos casos de incontinencia o debilidad. No son la solución para todo el mundo: si tenés dolor pélvico, dolor con las relaciones, dificultad para orinar o defecar, sensación constante de tensión o los ejercicios empeoran los síntomas, no sigas apretando por tu cuenta. A veces se necesita aprender a relajar y coordinar los músculos, no fortalecerlos más.</p>
  <ol>
  <li>Elegí una posición cómoda, por ejemplo acostada o sentada, y respirá normalmente.</li>
  <li>Imaginá que querés evitar que salgan gases y, a la vez, contener suavemente la orina. Debés notar un cierre y una elevación interna, sin apretar fuerte los glúteos, los muslos ni el abdomen.</li>
  <li>Como práctica inicial orientativa, contraé suavemente durante 3 segundos y después relajá por completo durante 3 a 6 segundos. Probá unas pocas repeticiones, sin dolor ni contener la respiración.</li>
  <li>La relajación completa es tan importante como contraer. Aumentá gradualmente solo si te resulta cómodo y un profesional no te indicó otra pauta.</li>
  </ol>
  <p><b>Importante:</b> no practiques deteniendo el chorro mientras orinás; identificar los músculos de esa manera puede servir una sola vez, pero repetirlo durante la micción puede dificultar el vaciado. Si no estás segura de qué músculos estás usando, consultá con una fisioterapeuta especializada en suelo pélvico, ginecología o medicina clínica para aprender la técnica adecuada.</p>
  </details>

  <details><summary>🌬️ Relajación y hábitos que ayudan</summary>
  <ul>
  <li><b>Respiración diafragmática:</b> sentate cómoda, aflojá mandíbula y hombros; inhalá suavemente dejando expandir el abdomen y exhalá sin empujar. Permití que la zona pélvica se relaje, sin hacer fuerza hacia abajo.</li>
  <li><b>Evitá el estreñimiento:</b> incorporá fibra de forma gradual, agua según tus indicaciones médicas y movimiento posible. No hagas fuerza excesiva al evacuar.</li>
  <li><b>Para levantar peso o toser:</b> evitá contener la respiración; exhalá durante el esfuerzo. Si esto desencadena pérdidas o dolor, pedí orientación personalizada.</li>
  <li><b>Con pérdidas urinarias:</b> no reduzcas drásticamente el agua. Registrá cuándo ocurren, revisá con el equipo de salud si la cafeína u otros hábitos influyen y preguntá por entrenamiento vesical o fisioterapia si corresponde.</li>
  <li><b>Intimidad y menopausia:</b> la sequedad o el dolor tienen tratamiento. No fuerces una relación dolorosa; conversá con ginecología sobre opciones apropiadas para tu historia clínica.</li>
  </ul>
  <p>No todas las personas necesitan la misma rutina. La fisioterapia de suelo pélvico puede evaluar fuerza, coordinación, relajación, respiración y hábitos intestinales/urinarios para adaptar el plan.</p>
  </details>

  <details><summary>🩺 Cuándo pedir ayuda y qué tratamientos existen</summary>
  <p>Solicitá una consulta si tenés pérdidas repetidas, sensación de bulto o presión vaginal, infecciones urinarias frecuentes, dolor pélvico, dolor sexual, dificultad para evacuar o cambios persistentes en la vejiga. Según la causa, pueden ayudar la fisioterapia de suelo pélvico, ejercicios específicos, entrenamiento de la vejiga, tratamiento del estreñimiento, medicamentos, un pesario o, en determinados casos, cirugía. No hace falta aceptar las pérdidas como algo inevitable.</p>
  <p><b>Buscá atención urgente</b> si no podés orinar, si aparece fiebre/escalofríos con dolor en la espalda o el costado, vómitos o sangre visible en la orina. El dolor pélvico súbito e intenso también requiere valoración urgente. Cualquier sangrado después de la menopausia debe ser evaluado pronto por un profesional.</p>
  <p><b>Para preparar la consulta:</b> anotá cuándo empezaron los síntomas, si hay pérdidas y con qué actividad, cuántas veces orinás de día y de noche, si sentís presión o bulto, cómo están las deposiciones, qué medicamentos usás y si los síntomas se relacionan con la glucemia, el parto o la menopausia. Podés pedir que te expliquen el examen antes de hacerlo y solicitar acompañamiento si te da vergüenza.</p>
  <p><a href="https://medlineplus.gov/spanish/pelvicfloordisorders.html" target="_blank" rel="noopener">MedlinePlus: problemas del piso pélvico</a></p>
  <p><a href="https://www.acog.org/womens-health/faqs/problemas-de-apoyo-pelvico" target="_blank" rel="noopener">ACOG: problemas de apoyo pélvico</a></p>
  <p><a href="https://www.niddk.nih.gov/health-information/informacion-de-la-salud/enfermedades-urologicas/ejercicios-kegel" target="_blank" rel="noopener">NIDDK: ejercicios de Kegel</a></p>
  </details>
  </div>
  <details><summary>🛡️ Prevención y cuidado cotidiano</summary>
  <ul><li>Mantené los controles de glucemia y seguí el tratamiento acordado.</li><li>Tomá agua regularmente, salvo que tu equipo de salud te haya indicado restringir líquidos.</li><li>No aguantes la orina durante muchas horas y no te automediques con antibióticos.</li><li>Si hay síntomas urinarios, evitá tomar medicamentos para resfrío o descongestivos sin consultar: algunos pueden empeorar la dificultad para orinar en personas con HBP.</li><li>La actividad física, una alimentación equilibrada, no fumar y el cuidado de la presión y el colesterol favorecen la salud general, pero no sustituyen la evaluación de síntomas.</li><li>No uses suplementos “para la próstata” ni tratamientos para la erección sin consultar, especialmente si tomás otros medicamentos o nitratos.</li></ul>
  </details>
  <details><summary>💬 Vergüenza, pareja y bienestar emocional</summary>
  <p>Los cambios al orinar o en la vida sexual pueden preocupar, afectar el sueño, la autoestima o la relación de pareja. No son un fracaso personal y no tenés que atravesarlos en silencio. Los profesionales de salud están acostumbrados a conversar sobre estos temas. Podés empezar diciendo: “Noté un cambio al orinar/en mi vida sexual y quisiera saber qué lo está causando”. Si te cuesta hablarlo, anotá las preguntas o pedí que te acompañe alguien de confianza.</p>
  </details>
  <details><summary>📋 Prepará tu consulta</summary>
  <ul><li>¿Cuándo empezó y está empeorando?</li><li>¿Cuántas veces me levanto de noche a orinar?</li><li>¿Tengo chorro débil, dolor, ardor, sangre, fiebre o sensación de no vaciar?</li><li>¿Tuve cambios en erección, deseo, eyaculación, lubricación o dolor sexual?</li><li>¿Cómo estuvieron mis glucemias? ¿Qué medicamentos y suplementos uso?</li><li>¿Qué controles necesito y cuándo debo volver?</li></ul>
  <p>Podés usar el Diario de la app para registrar la glucemia y llevar tus notas a la consulta.</p></details>
