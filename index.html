TIPS.push(...`📏 Cuándo medirte la glucemia|Tu médico te indica cuántas veces por día y en qué momentos. Anotá cada valor en el Diario, con la comida y la actividad, para que tu consulta sea más útil.

🧘 Estrés y glucemia|El estrés puede subir el azúcar. Probá respirar profundo, caminar o hacer una pausa de 5 minutos cuando lo sientas.

Hiperglucemia|Azúcar alta en sangre. Puede dar mucha sed y cansancio.
Índice glucémico|Mide qué tan rápido un alimento sube el azúcar en sangre.

V.tips=(o=>()=>o().replace('<h2>Glosario</h2>',`<h2 id="plan">Plan de movimiento de 4 semanas</h2><p>Para quienes están empezando. Tildá cada día que lo cumplas: llevás <b id="pg">${J("plan",[]).length}</b> de 28 días.</p><details><summary>Semana 1</summary><p>Objetivo: acostumbrar al cuerpo. Caminá de 5 a 10 minutos por día, o hacé 3 tandas de 3 minutos. Sumá 2 minutos de estiramiento suave.</p><button class="chip ${pk("1-1")?"on":""}" onclick="pd('1-1',this)">Día 1</button><button class="chip ${pk("1-2")?"on":""}" onclick="pd('1-2',this)">Día 2</button><button class="chip ${pk("1-3")?"on":""}" onclick="pd('1-3',this)">Día 3</button><button class="chip ${pk("1-4")?"on":""}" onclick="pd('1-4',this)">Día 4</button><button class="chip ${pk("1-5")?"on":""}" onclick="pd('1-5',this)">Día 5</button><button class="chip ${pk("1-6")?"on":""}" onclick="pd('1-6',this)">Día 6</button><button class="chip ${pk("1-7")?"on":""}" onclick="pd('1-7',this)">Día 7</button></details><details><summary>Semana 2</summary><p>Caminá de 10 a 15 minutos por día. Sumá los ejercicios sentada/o dos días en la semana.</p><button class="chip ${pk("2-1")?"on":""}" onclick="pd('2-1',this)">Día 1</button><button class="chip ${pk("2-2")?"on":""}" onclick="pd('2-2',this)">Día 2</button><button class="chip ${pk("2-3")?"on":""}" onclick="pd('2-3',this)">Día 3</button><button class="chip ${pk("2-4")?"on":""}" onclick="pd('2-4',this)">Día 4</button><button class="chip ${pk("2-5")?"on":""}" onclick="pd('2-5',this)">Día 5</button><button class="chip ${pk("2-6")?"on":""}" onclick="pd('2-6',this)">Día 6</button><button class="chip ${pk("2-7")?"on":""}" onclick="pd('2-7',this)">Día 7</button></details><details><summary>Semana 3</summary><p>Caminá de 15 a 20 minutos, 5 días. Sumá fuerza suave 2 días: pararte y sentarte de una silla y flexiones apoyada en la pared.</p><button class="chip ${pk("3-1")?"on":""}" onclick="pd('3-1',this)">Día 1</button><button class="chip ${pk("3-2")?"on":""}" onclick="pd('3-2',this)">Día 2</button><button class="chip ${pk("3-3")?"on":""}" onclick="pd('3-3',this)">Día 3</button><button class="chip ${pk("3-4")?"on":""}" onclick="pd('3-4',this)">Día 4</button><button class="chip ${pk("3-5")?"on":""}" onclick="pd('3-5',this)">Día 5</button><button class="chip ${pk("3-6")?"on":""}" onclick="pd('3-6',this)">Día 6</button><button class="chip ${pk("3-7")?"on":""}" onclick="pd('3-7',this)">Día 7</button></details><details><summary>Semana 4</summary><p>Caminá de 20 a 30 minutos la mayoría de los días y sumá fuerza suave 2 o 3 días. ¡Ya creaste un hábito!</p><button class="chip ${pk("4-1")?"on":""}" onclick="pd('4-1',this)">Día 1</button><button class="chip ${pk("4-2")?"on":""}" onclick="pd('4-2',this)">Día 2</button><button class="chip ${pk("4-3")?"on":""}" onclick="pd('4-3',this)">Día 3</button><button class="chip ${pk("4-4")?"on":""}" onclick="pd('4-4',this)">Día 4</button><button class="chip ${pk("4-5")?"on":""}" onclick="pd('4-5',this)">Día 5</button><button class="chip ${pk("4-6")?"on":""}" onclick="pd('4-6',this)">Día 6</button><button class="chip ${pk("4-7")?"on":""}" onclick="pd('4-7',this)">Día 7</button></details><p class="s">Un día de descanso por semana está bien. Si usás medicación que puede bajar el azúcar, medite antes y llevá una colación.</p><h2>Mi punto de partida</h2><details><summary>🛋️ Soy muy sedentaria/o</summary><p>Empezá desde la silla: los ejercicios sentada/o de esta sección y 3 minutos de caminata después de comer. No busques hacer mucho: buscá hacerlo todos los días. Sumá 1 o 2 minutos cada semana.</p></details><details><summary>⏱️ Tengo poco tiempo</summary><p>Hacé micro movimientos de 5 minutos: subí escaleras, caminá mientras hablás por teléfono, levantate cada 30 minutos. Tres tandas de 5 minutos valen.</p></details><details><summary>👵 Soy mayor de 60</summary><p>Priorizá el equilibrio y la fuerza suave, siempre cerca de una silla o pared. Caminá en terreno parejo y con calzado firme. Consultá a tu médico antes de aumentar el ritmo.</p></details><details><summary>🦵 Me duelen las rodillas o las articulaciones</summary><p>Probá movimientos de bajo impacto: bicicleta fija, ejercicios en el agua o caminata corta en superficie blanda. Evitá saltos. Si el dolor aumenta, frená y consultá.</p></details><details><summary>⚖️ Tengo sobrepeso</summary><p>Caminá en tandas cortas de 10 minutos, 3 veces al día. Elegí calzado amortiguado y sumá fuerza suave 2 días por semana. Los primeros resultados llegan con la constancia.</p></details><details><summary>🏃 Ya me muevo</summary><p>Sumá intensidad de a poco: alterná 2 minutos de caminata rápida con 2 de ritmo suave, 5 veces. Sumá fuerza 2 o 3 días. Medí tu glucemia antes si usás medicación que la baja.</p></details><h2>Ejercicios sentada/o</h2><p>Hacé 2 vueltas, una vez por día o más.</p><details><summary>🪑 Marcha sentada</summary><p>30 segundos, apoyando bien la espalda en el respaldo.</p></details><details><summary>🦵 Elevar rodillas</summary><p>Sentada/o, subí una rodilla y bajala. 10 veces por pierna.</p></details><details><summary>🦿 Estirar piernas</summary><p>Estirá una pierna hacia adelante y mantené 3 segundos. 10 veces por lado.</p></details><details><summary>🦶 Círculos de tobillos</summary><p>10 círculos hacia cada lado, con cada pie.</p></details><details><summary>💪 Brazos con botellas</summary><p>Con una botella de agua en cada mano, subí los brazos hasta los hombros. 10 veces.</p></details><details><summary>🔄 Giro de tronco</summary><p>Con las manos en el pecho, girá suavemente hacia un lado y el otro. 8 veces por lado.</p></details><details><summary>🍑 Apretar glúteos</summary><p>Apretá 3 segundos y soltá. 10 veces.</p></details><details><summary>🌬️ Respiración profunda</summary><p>Inhalá 4 segundos por la nariz y soltá 6 por la boca. 5 veces.</p></details><h2>Glosario</h2>`))(V.tips);
