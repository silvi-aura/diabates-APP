<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba acceso Firebase - Diabetes sin miedo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: #f3f7fb;
      color: #0f172a;
      padding: 20px;
    }

    .box {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 16px;
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
    }

    input,
    button {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      padding: 14px;
      font-size: 1rem;
      outline: none;
    }

    input {
      margin-bottom: 12px;
      background: #ffffff;
      color: #0f172a;
    }

    input:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.14);
    }

    button {
      cursor: pointer;
      font-weight: 900;
      border: 0;
      margin-bottom: 10px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #ffffff;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .status {
      min-height: 24px;
      margin: 12px 0;
      padding: 12px;
      border-radius: 14px;
      font-weight: 800;
      display: none;
    }

    .status.show {
      display: block;
    }

    .good {
      background: #dcfce7;
      color: #166534;
    }

    .bad {
      background: #fee2e2;
      color: #991b1b;
    }

    .warn {
      background: #fef3c7;
      color: #92400e;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .local {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      color: #64748b;
      white-space: pre-line;
      font-size: 0.92rem;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.86rem;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🛡️ Diabetes sin miedo</h1>
    <p>
      Esta es una prueba mínima para validar acceso por código usando Firebase.
      Si esto funciona, recién ahí integramos el sistema a la app completa.
    </p>

    <label for="code">Código de acceso</label>
    <input
      id="code"
      placeholder="DSM-XXXX-XXXX-XXXX"
      autocomplete="off"
      spellcheck="false"
    />

    <button class="btn-primary" id="validateBtn">Validar código online</button>
    <button class="btn-secondary" id="savedBtn">Entrar con acceso guardado</button>
    <button class="btn-danger" id="clearBtn">Borrar acceso guardado</button>

    <div id="status" class="status"></div>

    <div class="local" id="localInfo">Sin acceso guardado.</div>

    <div class="hint">
      Formato recomendado del código: <strong>DSM-XXXX-XXXX-XXXX</strong>.<br />
      Ejemplo: <strong>DSM-8F2K-9QL4-7XZ1</strong>.
    </div>
  </div>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    /***************************************************************
     * 1. REEMPLAZÁ ESTO CON LA CONFIGURACIÓN DE TU PROYECTO FIREBASE
     ***************************************************************/
    const firebaseConfig = {
      apiKey: "AIzaSy...PEGÁ_AQUÍ_TU_API_KEY",
      authDomain: "tu-proyecto.firebaseapp.com",
      projectId: "tu-proyecto",
      storageBucket: "tu-proyecto.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    const LICENSE_STORAGE_KEY = "dsm_license";
    const GRACE_DAYS = 7; // días de tolerancia offline después de validar

    const codeInput = document.getElementById("code");
    const statusEl = document.getElementById("status");
    const localInfo = document.getElementById("localInfo");

    let db = null;

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status show " + (type || "info");
    }

    function normalizeCode(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "");
    }

    function isValidFormat(code) {
      return /^DSM-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code);
    }

    function getSavedLicense() {
      try {
        return JSON.parse(localStorage.getItem(LICENSE_STORAGE_KEY) || "null");
      } catch (e) {
        return null;
      }
    }

    function saveLicense(code) {
      const payload = {
        code: code,
        validatedAt: new Date().toISOString(),
        app: "Diabetes sin miedo"
      };

      localStorage.setItem(LICENSE_STORAGE_KEY, JSON.stringify(payload));
      renderLocalInfo();
    }

    function clearLicense() {
      localStorage.removeItem(LICENSE_STORAGE_KEY);
      renderLocalInfo();
      setStatus("Acceso local borrado.", "warn");
    }

    function licenseAgeDays(saved) {
      if (!saved || !saved.validatedAt) return Infinity;
      const validated = new Date(saved.validatedAt).getTime();
      const now = Date.now();
      return (now - validated) / 86400000;
    }

    function isWithinGrace(saved) {
      return saved && licenseAgeDays(saved) <= GRACE_DAYS;
    }

    function nextExpiration(saved) {
      if (!saved || !saved.validatedAt) return null;
      const validated = new Date(saved.validatedAt).getTime();
      return new Date(validated + GRACE_DAYS * 86400000);
    }

    function renderLocalInfo() {
      const saved = getSavedLicense();

      if (!saved) {
        localInfo.textContent = "Sin acceso guardado.";
        return;
      }

      const exp = nextExpiration(saved);
      const within = isWithinGrace(saved);

      localInfo.textContent =
        "Código guardado: " + saved.code + "\n" +
        "Validado: " + new Date(saved.validatedAt).toLocaleString() + "\n" +
        "Vencimiento offline: " + (exp ? exp.toLocaleString() : "-") + "\n" +
        "Estado: " + (within ? "dentro del período permitido" : "período offline vencido");
    }

    async function validateOnline(code) {
      if (!db) {
        throw new Error("Firebase no está inicializado. Revisá firebaseConfig.");
      }

      const ref = db.collection("licenses").doc(code);
      const snap = await ref.get();

      if (!snap.exists) {
        throw new Error("Código no encontrado en Firebase.");
      }

      const data = snap.data();

      if (data.active !== true) {
        throw new Error("Código inactivo.");
      }

      if (data.expiresAt && typeof data.expiresAt.toDate === "function") {
        const expires = data.expiresAt.toDate();
        if (expires < new Date()) {
          throw new Error("Código vencido.");
        }
      }

      return data;
    }

    async function handleValidate() {
      const code = normalizeCode(codeInput.value);

      if (!code) {
        setStatus("Ingresá un código de acceso.", "warn");
        return;
      }

      if (!isValidFormat(code)) {
        setStatus("Formato inválido. Usá algo como DSM-8F2K-9QL4-7XZ1.", "bad");
        return;
      }

      setStatus("Validando código en Firebase...", "info");

      try {
        const data = await validateOnline(code);
        saveLicense(code);

        const customer = data.customer ? " · Cliente: " + data.customer : "";
        setStatus("✅ Acceso válido." + customer, "good");
      } catch (error) {
        const msg = error && error.message ? error.message : "Error desconocido.";

        if (error && error.code === "permission-denied") {
          setStatus("❌ Código inválido, inactivo o vencido.", "bad");
        } else if (/network|fetch|unavailable/i.test(msg)) {
          setStatus(
            "⚠️ No hay conexión con Firebase. Si ya validaste antes, podés usar el acceso guardado dentro del período offline.",
            "warn"
          );
        } else {
          setStatus("❌ " + msg, "bad");
        }
      }
    }

    function handleUseSaved() {
      const saved = getSavedLicense();

      if (!saved) {
        setStatus("No hay acceso guardado en este dispositivo.", "warn");
        return;
      }

      if (!isWithinGrace(saved)) {
        setStatus("El acceso guardado venció el período offline. Volvé a validar con internet.", "bad");
        return;
      }

      setStatus("✅ Acceso local válido. Esto simularía la entrada a la app.", "good");
    }

    function initFirebase() {
      if (typeof firebase === "undefined") {
        setStatus(
          "❌ No se cargó Firebase. Revisá conexión a internet o abrí el archivo desde localhost / hosting, no desde file://.",
          "bad"
        );
        return;
      }

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        db = firebase.firestore();
        setStatus("Firebase listo. Ingresá un código para probar.", "info");
      } catch (error) {
        const msg = error && error.message ? error.message : "Error al iniciar Firebase.";
        setStatus("❌ " + msg, "bad");
      }
    }

    document.getElementById("validateBtn").addEventListener("click", handleValidate);
    document.getElementById("savedBtn").addEventListener("click", handleUseSaved);
    document.getElementById("clearBtn").addEventListener("click", clearLicense);

    codeInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        handleValidate();
      }
    });

    initFirebase();
    renderLocalInfo();

    const saved = getSavedLicense();
    if (saved && isWithinGrace(saved)) {
      setStatus("Hay un acceso guardado vigente. Podés entrar con él o validar de nuevo.", "good");
    }
  </script>
</body>
</html>
